name: Validate and release Google harness packages

on:
  pull_request:
    paths:
      - package.json
      - skills/**
      - scripts/**
      - .gemini/**
      - .agents/agents/**
      - .antigravity/**
      - tests/harnesses/**
      - .github/scripts/test-harness-install.mjs
      - .claude-plugin/plugin.json
      - .cursor-plugin/plugin.json
      - agents/**
      - .github/workflows/release-gemini-extension.yml
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check generated native agents
        run: npm run check
      - name: Check versions and build Gemini-only extension
        run: node scripts/package-gemini.mjs dist/gemini
      - name: Validate with Gemini CLI
        run: npx --yes @google/gemini-cli@0.65.0 extensions validate dist/gemini
      - name: Verify native Antigravity plugin and archive installation
        run: node .github/scripts/test-harness-install.mjs antigravity

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tag matches extension version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./.gemini/gemini-extension.json").version')"
          test "$TAG" = "v$version" || {
            echo "Tag $TAG must match .gemini/gemini-extension.json version v$version" >&2
            exit 1
          }
      - name: Package Gemini-only extension archive
        run: |
          node scripts/package-gemini.mjs dist/extension
          tar -C dist/extension -czf scopewright.tar.gz .
          mkdir -p dist/unpacked
          tar -xzf scopewright.tar.gz -C dist/unpacked
      - name: Validate packaged extension
        run: npx --yes @google/gemini-cli@0.65.0 extensions validate dist/unpacked
      - name: Package native Antigravity plugin archive
        run: |
          node scripts/package-antigravity.mjs dist/antigravity
          tar -C dist/antigravity -czf scopewright-antigravity.tar.gz .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            scopewright.tar.gz
            scopewright-antigravity.tar.gz
