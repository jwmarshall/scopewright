name: Validate and release Gemini CLI extension

on:
  pull_request:
    paths:
      - gemini-extension.json
      - package.json
      - skills/**
      - .agents/skills/**
      - .gemini/agents/**
      - .github/workflows/release-gemini-extension.yml
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check extension version matches package version
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const ext = JSON.parse(fs.readFileSync("gemini-extension.json", "utf8"));
            if (pkg.version !== ext.version) {
              console.error(`Version mismatch: package.json=${pkg.version}, gemini-extension.json=${ext.version}`);
              process.exit(1);
            }
          '
      - name: Validate with Gemini CLI
        run: npx --yes @google/gemini-cli@0.62.0 extensions validate .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches extension version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./gemini-extension.json").version')"
          test "$TAG" = "v$version" || {
            echo "Tag $TAG must match gemini-extension.json version v$version" >&2
            exit 1
          }
      - name: Package Gemini-only extension archive
        run: |
          mkdir -p dist/extension/skills dist/extension/agents
          cp gemini-extension.json LICENSE dist/extension/
          cp -R skills/root-prompt-reviewer skills/scopewright-create dist/extension/skills/
          cp .gemini/agents/root-prompt-reviewer.md dist/extension/agents/
          cp -R reference dist/extension/
          tar -C dist/extension -czf scopewright.tar.gz .
          mkdir -p dist/unpacked
          tar -xzf scopewright.tar.gz -C dist/unpacked
      - name: Validate packaged extension
        run: npx --yes @google/gemini-cli@0.62.0 extensions validate dist/unpacked
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: scopewright.tar.gz
