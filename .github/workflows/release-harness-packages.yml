name: Validate and release harness packages

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - LICENSE
      - README.md
      - reference/**
      - skills/**
      - agents/**
      - scripts/**
      - tests/**
      - .agents/agents/**
      - .antigravity/**
      - .claude/**
      - .claude-plugin/**
      - .codex/**
      - .cursor-plugin/**
      - .cursor/**
      - .gemini/**
      - .omp/**
      - .opencode/**
      - .github/scripts/**
      - .github/workflows/release-harness-packages.yml
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check generated native agents and package behavior
        run: npm run check
      - name: Pack, install, and verify the shipped npm CLI for all eight harnesses
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node .github/scripts/check-npm-package.mjs
      - name: Retain the exact verified npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: scopewright-npm
          path: dist/npm/*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Check native manifest consistency and build all eight release archives
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node .github/scripts/package-release.mjs
      - name: Validate archive-unpacked Gemini extension with the official CLI
        run: |
          mkdir dist/release/gemini-unpacked
          tar -xzf dist/release/scopewright-gemini.tar.gz -C dist/release/gemini-unpacked
          npx --yes @google/gemini-cli@0.65.0 extensions validate dist/release/gemini-unpacked

  install:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    name: ${{ matrix.harness }} release install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex, pi, omp, antigravity, gemini, opencode, cursor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise staged release installation without credentials or runtime network
        run: node .github/scripts/test-harness-install.mjs "${{ matrix.harness }}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate tag against package version and build named harness archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/package-release.mjs
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release/scopewright-claude.tar.gz
            dist/release/scopewright-codex.tar.gz
            dist/release/scopewright-pi.tar.gz
            dist/release/scopewright-omp.tar.gz
            dist/release/scopewright-antigravity.tar.gz
            dist/release/scopewright-gemini.tar.gz
            dist/release/scopewright-opencode.tar.gz
            dist/release/scopewright-cursor.tar.gz

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, install]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require trusted-publishing-capable npm
        run: |
          node --input-type=module -e 'import {execFileSync} from "node:child_process"; const [major,minor,patch]=execFileSync("npm",["--version"],{encoding:"utf8"}).trim().split(".").map(Number); if(major<11 || (major===11 && (minor<5 || (minor===5 && patch<1)))) throw new Error("Trusted publishing requires npm >=11.5.1");'
      - uses: actions/download-artifact@v4
        with:
          name: scopewright-npm
          path: dist/npm
      - name: Check the verified tarball identity against the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync, readdirSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          const files = readdirSync("dist/npm").filter(file => file.endsWith(".tgz"));
          assert.equal(files.length, 1);
          const pkg = JSON.parse(execFileSync("tar", ["-xOf", "dist/npm/" + files[0], "package/package.json"], { encoding: "utf8" }));
          const source = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(pkg.name, "scopewright");
          assert.equal(pkg.version, source.version);
          assert.equal(process.env.RELEASE_TAG, "v" + pkg.version);
          NODE
      # npm settings: scopewright -> Trusted Publisher -> GitHub Actions:
      # owner jwmarshall, repository scopewright, workflow release-harness-packages.yml,
      # environment blank. No npm token or GitHub environment is used.
      - name: Publish the exact verified tarball through GitHub OIDC
        run: npm publish dist/npm/*.tgz --access public --provenance --ignore-scripts
